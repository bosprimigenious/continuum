[package]
name = "continuum-gui"
version = "0.1.0-alpha.1"
description = "Continuum desktop shell over the continuum CLI sidecar"
authors = ["Continuum contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "continuum_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
