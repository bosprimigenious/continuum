name: Publish CLI to PyPI

# Requires a PyPI pending publisher that matches these claims exactly:
#   project=continuum-history owner=bosprimigenious repo=continuum
#   workflow=publish.yml environment=pypi
# Register at https://pypi.org/manage/account/publishing/ before dispatch.
# 422 invalid-publisher is a PyPI config miss, not a reason to bump 0.1.0a1.
# See docs/publishing.md.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CLI distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/check.py
      - run: uv run python scripts/release_check.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/continuum_history-*
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/continuum-history/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - run: uv publish --trusted-publishing always
      - name: Explain missing pending publisher
        if: failure()
        run: |
          echo "::error::PyPI OIDC 422 invalid-publisher. Register a pending publisher at https://pypi.org/manage/account/publishing/ with project=continuum-history owner=bosprimigenious repository=continuum workflow=publish.yml environment=pypi. Do not bump 0.1.0a1 to retry."
