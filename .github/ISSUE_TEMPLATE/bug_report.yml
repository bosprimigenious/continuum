name: Bug report
description: Report a reproducible behavior with synthetic data only
body:
  - type: markdown
    attributes:
      value: "Do not upload real chats, databases, tokens or private paths. Security reports belong in the private Security form."
  - type: input
    id: version
    attributes:
      label: Commit and platform
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
